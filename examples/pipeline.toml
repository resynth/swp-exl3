# Coordinator. Stages in pipeline order; ranges must be contiguous from 0.
# Copy to the coordinator machine and set model_dir + the [[stage]] addrs.
# Addresses are the Thunderbolt endpoints; the stages bind only those interfaces (see the stage
# files and README section 9), so a loopback address will NOT reach them:
#   cp examples/pipeline.toml ~/models/pipeline.toml
[pipeline]
model_dir = "/models/GLM-5.3-Flash-exl3"     # machine-local: for tokenizer + contract check; optional
secret_env = "SWP_SECRET"
wire_dtype = "f32"                   # "bf16" halves bytes; decide after a logits KL comparison
chunk = 2048                         # prefill rows per FORWARD; measured best on this pair (RESULTS.md task 7)
topk = 64

[[stage]]
addr = "10.10.10.1:7801"             # the Thunderbolt-network address of the Razer
layers = [0, 7]

[[stage]]
addr = "10.10.10.2:7802"             # the Thunderbolt-network address of the Strix
layers = [7, 45]
